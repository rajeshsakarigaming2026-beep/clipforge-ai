databases:
  - name: clipforge-db
    databaseName: clipforge
    user: clipforge
    plan: free

envVarGroups:
  - name: clipforge-shared
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CLOUD_WORKER
        value: "true"
      - key: NEXT_PUBLIC_APP_URL
        value: https://clipforge-ai.onrender.com
      - key: NEXT_PUBLIC_CLOUD_APP_URL
        value: https://clipforge-ai.onrender.com
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_SOURCE_SECONDS
        value: "900"
      - key: HIGHLIGHT_PROVIDER
        value: local

services:
  - type: web
    name: clipforge-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: clipforge-shared
      - key: CLIPFORGE_ROLE
        value: web

  - type: worker
    name: clipforge-ai-worker
    runtime: docker
    plan: 0.5c-512mb
    envVars:
      - fromGroup: clipforge-shared
      - key: CLIPFORGE_ROLE
        value: worker
