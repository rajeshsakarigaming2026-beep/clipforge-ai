databases:
  - name: clipforge-db
    databaseName: clipforge
    user: clipforge
    plan: free

envVarGroups:
  - name: clipforge-shared
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: CLOUD_WORKER
        value: "true"
      - key: NEXT_PUBLIC_APP_URL
        value: https://clipforge-ai.onrender.com
      - key: NEXT_PUBLIC_CLOUD_APP_URL
        value: https://clipforge-ai.onrender.com
      - key: WORKER_URL
        value: https://clipforge-ai-worker.onrender.com
      - key: STORAGE_DRIVER
        value: database
      - key: ADMIN_EMAILS
        value: rajeshsakarigaming2026@gmail.com
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_SOURCE_SECONDS
        value: "900"
      - key: HIGHLIGHT_PROVIDER
        value: local

services:
  - type: web
    name: clipforge-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - fromGroup: clipforge-shared
      - key: CLIPFORGE_ROLE
        value: web

  - type: web
    name: clipforge-ai-worker
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - fromGroup: clipforge-shared
      - key: CLIPFORGE_ROLE
        value: worker
